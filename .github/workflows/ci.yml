name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Gate on what actually ships: runtime dependencies, high severity and up.
      # Dev-only tooling advisories are left to Dependabot instead of blocking every PR.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + MCP contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test (boot server, call it over HTTP like PlayMCP)
        run: npm run smoke

      # Lint the running server the way an agent sees it: tool docs, annotations,
      # and real responses from mcp-probe.json (no inline base64, links resolve).
      - name: Agent lint (mcp-agent-lint)
        run: |
          PORT=3998 DB_PATH="$(mktemp -d)/lint.db" node dist/index.js &
          for _ in $(seq 1 30); do curl -sf http://localhost:3998/health > /dev/null && break; sleep 0.2; done
          npx -y github:Moomooti/mcp-agent-lint http://localhost:3998/mcp --probe mcp-probe.json --check-links

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ddongpoktan-mcp:ci .
