name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Gate on what actually ships: runtime dependencies, high severity and up.
      # Dev-only tooling advisories are left to Dependabot instead of blocking every PR.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck (src + tests)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + MCP contract tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test (boot server, call it over HTTP like PlayMCP)
        run: npm run smoke

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ddongpoktan-mcp:ci .
