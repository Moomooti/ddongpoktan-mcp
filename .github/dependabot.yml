version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    groups:
      # Lint/test tooling moves together and never ships to users, so one PR is enough.
      dev-tooling:
        dependency-type: development
      # Runtime patches/minors get one PR so CI checks them together.
      runtime-minor-and-patch:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Seoul
